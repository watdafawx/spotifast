# Fork only: merge crmne/spotifast into the mods branch every day.
# A clean merge that builds is pushed. Anything else fails the run, with the
# conflicting files in its summary; GitHub emails the owner about a failed
# scheduled run (forks have Issues off, so no issue is opened).
name: Sync upstream

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mods
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/crmne/spotifast
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "mods already has everything on upstream/main." >> "$GITHUB_STEP_SUMMARY"
            echo "result=current" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          elif [ "$(git diff --name-only --diff-filter=U)" = "Cargo.lock" ]; then
            # Only the lockfile clashed: take upstream's and let cargo add
            # back the fork's crates (wry and what it pulls in).
            git checkout --theirs Cargo.lock
            cargo metadata --features mods --format-version 1 > /dev/null
            git add Cargo.lock
            git commit --no-edit
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Merging upstream/main into mods needs a hand:"
              echo
              echo '    git fetch upstream && git merge upstream/main'
              echo
              echo "Conflicting files:"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort
            exit 1
          fi

      - name: Build and test
        if: steps.merge.outputs.result == 'merged'
        run: |
          cargo build --no-default-features --features mods
          cargo test --no-default-features --features mods --lib mods::

      - name: Push
        if: steps.merge.outputs.result == 'merged'
        shell: bash
        run: |
          # Commits pushed to mods while this ran come along, not get refused.
          git pull --no-rebase --no-edit origin mods
          git push origin mods

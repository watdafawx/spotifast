# Fork only: Spotifast with mods, released on this fork, which is where builds
# with mods look for updates (src/updates.rs). Upstream's Release workflow stays
# off here: it signs with upstream's key and publishes upstream's packages.
#
# After each Sync upstream (and by hand): when the mods branch's version has no
# release on this fork yet, its Windows build with mods is published under
# upstream's version number, so a mods build sees the update when upstream
# moves on. The fork's v* tags came from upstream when it was forked: the
# release's tag is moved to the mods commit it was built from.
name: Release mods

on:
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mods
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is released on this fork already." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "Releasing $tag from mods at $(git rev-parse --short HEAD)." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
      CARGO_TERM_COLOR: always
      TAG: ${{ needs.plan.outputs.tag }}
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - run: rustup target add x86_64-pc-windows-msvc
      # As upstream's Release: GLEW for libprojectM from vcpkg's static-CRT
      # triplet, and Ninja inside the MSVC environment.
      - run: vcpkg install glew:x64-windows-static
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - run: cargo build --release --target x86_64-pc-windows-msvc --features mods

      - name: Check the binary
        shell: pwsh
        run: |
          $binary = "target\$env:TARGET\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          if ($imports -match 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll') { throw "Spotifast imports an MSVC runtime" }
          $version = (& $binary --version | Out-String).Trim()
          if ($version -ne "spotifast $($env:TAG.TrimStart('v'))") { throw "Unexpected --version output: $version" }

      # The names the updater asks for: spotifast-<tag>-<target>.zip and -setup.exe
      - name: Package
        shell: bash
        run: |
          name="spotifast-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/spotifast.exe" README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"
          rm -r "$name"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$($env:TAG.TrimStart('v'))" "/DArch=x86_64" `
            "/DBinary=$PWD\target\$env:TARGET\release\spotifast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checksums
        shell: bash
        run: python packaging/release-names.py dist "$TAG"

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          git tag -f "$TAG" "$SHA"
          git push -f origin "refs/tags/$TAG"
          notes="packaging/release-notes/$TAG.md"
          {
            echo "Spotifast $TAG with mods, built from this fork's mods branch."
            echo
            if [ -f "$notes" ]; then cat "$notes"; fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "Spotifast $TAG (mods)" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
